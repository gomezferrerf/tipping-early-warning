[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tipping-early-warning"
version = "0.1.0"
description = "Can a noisy time series warn us before a tipping point? Early-warning signals near a saddle-node bifurcation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fernando" }]
keywords = ["dynamical systems", "bifurcation", "tipping points", "early warning signals", "stochastic processes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.0",
    "matplotlib>=3.8",
    "imageio-ffmpeg>=0.5",
    "typer>=0.12",
    "pyyaml>=6",
    "pydantic>=2.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
deck = ["python-pptx>=1.0", "pillow>=10"]

[project.scripts]
tipping = "tipping.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tipping"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["numpy.typing.mypy_plugin"]

[[tool.mypy.overrides]]
module = ["scipy.*", "joblib.*", "duckdb.*", "imageio_ffmpeg.*", "pptx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: statistical tests that take more than a few seconds"]

[tool.coverage.run]
source = ["src/tipping"]
